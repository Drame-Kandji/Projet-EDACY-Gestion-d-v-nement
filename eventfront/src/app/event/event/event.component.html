<div class="group bg-white rounded-lg shadow overflow-hidden hover:shadow-lg transition-all duration-300 z-0">
  <div class="aspect-w-16 aspect-h-9 bg-gray-200">
    <!-- Utilisez des images réelles, ici un placeholder -->
    <img
      [src]="event.image"
      [alt]="event.title"
      class="w-full h-48  object-cover group-hover:scale-110 transition-transform duration-500 z-0"
    >
  </div>

  <div class="p-4">
    <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-indigo-100 text-indigo-800">
      {{ event.category }}
    </span>

    <h3 class="mt-2 text-lg font-medium text-gray-900">{{ event.title }}</h3>
    @if (!description) {
      <p class="p-2 text-gray-700">{{event.description}}</p>
    }

    <div class="mt-2 flex items-center text-sm text-gray-500">
      <svg class="flex-shrink-0 mr-1.5 h-4 w-4 text-gray-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
      </svg>
      <span>{{ event.date }}</span>
    </div>

    <div class="mt-1 flex items-center text-sm text-gray-500">
      <svg class="flex-shrink-0 mr-1.5 h-4 w-4 text-gray-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
      </svg>
      <span class="truncate">{{ event.location }}</span>
    </div>
    @if (!description) {
      <div class="mt-1 flex items-center text-sm text-gray-500">
        <svg class="flex-shrink-0 mr-1.5 h-4 w-4 text-gray-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span class="truncate">{{ event.heure }}H</span>
      </div>
    }
    <div class="mt-4 flex justify-between items-center">
      @if (description) {
        <span class="text-sm text-gray-500">{{ event.attendees }} participants</span>
      <button (click)="openEditModal(event)" class="inline-flex items-center px-2 py-1 border border-transparent text-sm font-medium rounded shadow-sm text-white bg-yellow-500 hover:bg-yellow-600">
        Modifier
      </button>
      <button (click)="deleteEvent(event.id)" class="inline-flex items-center px-2 py-1 border border-transparent text-sm font-medium rounded shadow-sm text-white bg-red-500 hover:bg-red-600">
        Supprimer
      </button>
      <a  [routerLink]="['/event', event.id]"
         routerLinkActive="router-link-active" class="inline-flex items-center px-2 py-1 border border-transparent text-sm font-medium rounded shadow-sm text-white bg-indigo-600 hover:bg-indigo-700">
        Savoir plus
      </a>
      }
      @else {
        <button
          class="inline-flex items-center px-2 py-1 border border-transparent text-sm font-medium rounded shadow-sm text-white bg-indigo-600 hover:bg-indigo-700">
        S'inscrire
      </button>
      }

    </div>
  </div>
  <!-- Modal de modification/création d'événement -->
  <app-edit-event-modal
  [isOpen]="isModalOpen"
  [event]="selectedEvent"
  (close)="closeModal()"
  (save)="saveEvent($event)">
</app-edit-event-modal>
</div>
