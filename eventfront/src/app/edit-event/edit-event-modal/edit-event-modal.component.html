<!-- edit-event-modal.component.html -->
<div *ngIf="isOpen" class="fixed inset-0 z-1 overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
  <!-- Overlay semi-transparent -->
  <div class="fixed inset-1 bg-gray-100/80 transition-opacity" (click)="onClose()"></div>

  <!-- Conteneur du modal centré -->
  <div class="flex items-center justify-center min-h-screen p-4 text-center sm:block sm:p-0">
    <!-- Conteneur du contenu du modal -->
    <div class="relative  inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg sm:w-full">
      <!-- Bouton de fermeture -->
      <button (click)="onClose()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>

      <!-- En-tête -->
      <div class="bg-gradient-to-r from-blue-500 to-purple-600 px-6 py-4">
        <h3 class="text-lg font-medium text-white" id="modal-title">
          {{ event ? 'Modifier l\'événement' : 'Créer un nouvel événement' }}
        </h3>
      </div>

      <!-- Contenu du modal - Formulaire -->
      <form [formGroup]="eventForm" (ngSubmit)="onSubmit()">
        <div class="bg-white px-6 py-4">
          <div class="grid grid-cols-1 gap-y-6 gap-x-4 sm:grid-cols-2">
            <!-- Titre -->
            <div class="col-span-2">
              <label for="title" class="block text-sm font-medium text-gray-700">Titre *</label>
              <div class="mt-1">
                <input type="text" id="title" formControlName="title"
                  class="shadow-sm h-10 px-2 focus:ring-indigo-500 focus:border-indigo-500 block w-full sm:text-sm border-blue-300 rounded-md">
              </div>
              <p *ngIf="eventForm.get('title')?.touched && eventForm.get('title')?.invalid" class="mt-1 text-sm text-red-600">
                Titre requis (minimum 3 caractères)
              </p>
            </div>

            <!-- Description -->
            <div class="col-span-2">
              <label for="description" class="block text-sm font-medium text-gray-700">Description *</label>
              <div class="mt-1">
                <textarea id="description" formControlName="description" rows="3"
                  class="shadow-sm px-2 focus:ring-indigo-500 focus:border-indigo-500 block w-full sm:text-sm border-blue-300 rounded-md"></textarea>
              </div>
              <p *ngIf="eventForm.get('description')?.touched && eventForm.get('description')?.invalid" class="mt-1 text-sm text-red-600">
                Description requise (minimum 10 caractères)
              </p>
            </div>

            <!-- Date -->
            <div>
              <label for="date" class="block text-sm font-medium text-gray-700">Date *</label>
              <div class="mt-1">
                <input type="date" id="date" formControlName="date"
                  class="shadow-sm px-2 h-8 focus:ring-indigo-500 focus:border-indigo-500 block w-full sm:text-sm border-blue-300 rounded-md">
              </div>
              <p *ngIf="eventForm.get('date')?.touched && eventForm.get('date')?.invalid" class="mt-1 text-sm text-red-600">
                Date requise
              </p>
            </div>

            <!-- Heure -->
            <div>
              <label for="heure" class="block text-sm font-medium text-gray-700">Heure *</label>
              <div class="mt-1">
                <input type="heure" id="heure" formControlName="heure"
                  class="shadow-sm px-2 h-8 focus:ring-indigo-500 focus:border-indigo-500 block w-full sm:text-sm border-blue-300 rounded-md">
              </div>
              <p *ngIf="eventForm.get('heure')?.touched && eventForm.get('heure')?.invalid" class="mt-1 text-sm text-red-600">
                Heure requise
              </p>
            </div>

            <!-- Lieu -->
            <div class="col-span-2">
              <label for="location" class="block text-sm font-medium text-gray-700">Lieu *</label>
              <div class="mt-1">
                <input type="text" id="location" formControlName="location"
                  class="shadow-sm h-8 px-2 focus:ring-indigo-500 focus:border-indigo-500 block w-full sm:text-sm border-blue-300 rounded-md">
              </div>
              <p *ngIf="eventForm.get('location')?.touched && eventForm.get('location')?.invalid" class="mt-1 text-sm text-red-600">
                Lieu requis
              </p>
            </div>

            <!-- Catégorie -->
            <div>
              <label for="category" class="block text-sm font-medium text-gray-700">Catégorie *</label>
              <div class="mt-1">
                <select id="category" formControlName="category"
                  class="shadow-sm h-8 px-2 focus:ring-indigo-500 focus:border-indigo-500 block w-full sm:text-sm border-blue-300 rounded-md">
                  <option *ngFor="let category of categories" [value]="category">{{ category }}</option>
                </select>
              </div>
              <p *ngIf="eventForm.get('category')?.touched && eventForm.get('category')?.invalid" class="mt-1 text-sm text-red-600">
                Catégorie requise
              </p>
            </div>

            <!-- Nombre max. de participants -->
            <div>
              <label for="attendees" class="block text-sm font-medium text-gray-700">Nombre max. de participants *</label>
              <div class="mt-1">
                <input type="number" id="attendees" formControlName="attendees" min="1"
                  class="shadow-sm h-8 px-2 focus:ring-indigo-500 focus:border-indigo-500 block w-full sm:text-sm border-blue-300 rounded-md">
              </div>
              <p *ngIf="eventForm.get('attendees')?.touched && eventForm.get('attendees')?.invalid" class="mt-1 text-sm text-red-600">
                Au moins 1 participant requis
              </p>
            </div>

            <!-- Image -->
            <div class="col-span-2">
              <label class="block text-sm font-medium text-gray-700">Image de l'événement</label>
              <div class="mt-2 flex items-center">
                <div *ngIf="imagePreview" class="relative">
                  <img [src]="imagePreview" alt="Aperçu de l'image" class="h-32 w-32 object-cover rounded-md">
                  <button type="button" (click)="removeImage()" class="absolute -top-2 -right-2 text-red-500 bg-white rounded-full p-1 shadow-md">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                  </button>
                </div>
                <div *ngIf="!imagePreview" class="flex justify-center items-center h-32 w-32 bg-gray-100 rounded-md border-2 border-dashed border-blue-300">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                  </svg>
                </div>
                <div class="ml-5">
                  <input type="file" formControlName="image" id="event-image" (change)="onFileChange($event)" hidden accept="image/*">
                  <label for="event-image" class="cursor-pointer py-2 px-3 border border-blue-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50">
                    Choisir une image
                  </label>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Pied de page avec boutons -->
        <div class="bg-gray-50 px-6 py-4 flex justify-end space-x-3">
          <button type="button" (click)="onClose()" class="py-2 px-4 border border-blue-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none">
            Annuler
          </button>
          <button type="submit" [disabled]="isSubmitting" class="inline-flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none disabled:opacity-70">
            <svg *ngIf="isSubmitting" class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            {{ isSubmitting ? 'Enregistrement...' : 'Enregistrer' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
