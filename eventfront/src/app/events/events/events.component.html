<div class="bg-gray-50 min-h-screen">
  <!-- filtrage par recherche -->
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sticky top-23 z-1">
    <div class="bg-white shadow-lg rounded-lg p-6 -mt-12 relative">
      <div class="flex flex-col md:flex-row md:items-center md:justify-between">
        <div class="w-full md:w-1/3 mb-4 md:mb-0">
          <div class="relative">
            <input
              type="text"
              placeholder="Rechercher un événement..."
              [(ngModel)]="searchTerm"
              class="block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 pl-10 py-3"
            />
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <svg class="h-5 w-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
              </svg>
            </div>
          </div>
        </div>
        <div class="flex flex-wrap gap-3">
          <span class="text-gray-700 font-medium self-center hidden md:inline">Filtrer par :</span>
          <div *ngFor="let category of categories" class="flex-shrink-0">
            <button
              (click)="filterByCategory(category)"
              [ngClass]="selectedCategory === category ? 'bg-indigo-700 text-white' : 'bg-gray-100 text-gray-800 hover:bg-gray-200'"
              class="px-4 py-2 rounded-full text-sm font-medium transition-colors duration-200"
            >
              {{ category }}
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
<!-- la liste des evenements -->
  <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 bg-gray-50">
    <h2 class="text-3xl font-bold text-gray-900 mb-8">Événements à venir</h2>

    <div *ngIf="filteredEvents.length > 0; else noEvents">
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
        @for (event of filteredEvents; track event.id) {
          <app-event
           [event]="event" [description]="true"
           (UpdateEvent)="UpdateEvent($event)"
           (DeleteEvent)="DeleteEvent($event)"
           >
          </app-event>
        }
      </div>
    </div>

    <ng-template #noEvents>
      <div class="text-center py-12 px-4">
        <svg class="mx-auto h-16 w-16 text-gray-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <h3 class="mt-2 text-lg font-medium text-gray-900">Aucun événement trouvé</h3>
        <p class="mt-1 text-gray-500">Essayez de modifier vos filtres ou votre recherche</p>
      </div>
    </ng-template>

    <div class="mt-8 text-center">
      <a href="#" class="inline-flex items-center px-4 py-2 border border-transparent text-base font-medium rounded-md text-indigo-700 bg-indigo-100 hover:bg-indigo-200">
        Voir tous les événements
        <svg class="ml-2 -mr-1 h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3" />
        </svg>
      </a>
    </div>
  </section>
  <app-edit-event-modal
  [isOpen]="isModalOpen"
  [event]="selectedEvent"
  (close)="closeModal()"
  (save)="saveEvent($event)"
  >
</app-edit-event-modal>
</div>
