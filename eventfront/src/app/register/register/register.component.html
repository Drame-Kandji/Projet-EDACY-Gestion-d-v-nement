<!-- login.component.html -->
<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-600 to-purple-600 p-4">
  <div class="w-full max-w-md">
    <!-- Carte avec effet de verre -->
    <div class="relative bg-white bg-opacity-90 backdrop-filter backdrop-blur-sm rounded-xl shadow-2xl overflow-hidden">
      <!-- Éléments décoratifs -->
      <div class="absolute -top-12 -right-12 w-32 h-32 bg-indigo-400 rounded-full opacity-30"></div>
      <div class="absolute -bottom-12 -left-12 w-32 h-32 bg-purple-400 rounded-full opacity-30"></div>

      <!-- Formulaire de connexion -->
      <div class="relative p-8 z-10"
           [style.opacity]="formOpacity"
           [style.transform]="formTransform"
           style="transition: all 0.6s ease-out">

        <!-- Logo et en-tête -->
        <div class="text-center mb-8">
          <div class="flex justify-center mb-4">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
          </div>
          <h1 class="text-3xl font-bold text-gray-800">EventManager</h1>
          <p class="text-gray-600 mt-2">Inscrivez-vous pour gérer vos événements</p>
        </div>

        <!-- Message d'erreur -->
        <div *ngIf="loginError"
             class="mb-4 p-3 bg-red-50 border border-red-200 text-red-600 rounded-lg text-sm animate-pulse">
          {{ loginError }}
        </div>

        <!-- Formulaire -->
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
          <!--prenom -->
          <div class="mb-6 group">
            <label for="firstname" class="block text-sm font-medium text-gray-700 mb-1">Votre prenom</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">

              </div>
              <input
                id="firstname"
                type="text"
                formControlName="firstname"
                placeholder="votre prenom"
                class="block w-full pl-2 pr-3 py-3 border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all duration-200"
                [ngClass]="{'border-red-500 ring-1 ring-red-500': loginForm.get('firstname')?.invalid && loginForm.get('email')?.touched}"
              >
            </div>
            <div *ngIf="loginForm.get('firstname')?.invalid && loginForm.get('email')?.touched" class="mt-1 text-sm text-red-600">
              <div *ngIf="loginForm.get('firstname')?.errors?.['required']">le prenom est est requis.</div>
            </div>
          </div>
          <!--nom -->
          <div class="mb-6 group">
            <label for="lastname" class="block text-sm font-medium text-gray-700 mb-1">Votre nom</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">

              </div>
              <input
                id="lastname"
                type="text"
                formControlName="lastname"
                placeholder="votre nom"
                class="block w-full pl-2 pr-3 py-3 border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all duration-200"
                [ngClass]="{'border-red-500 ring-1 ring-red-500': loginForm.get('lastname')?.invalid && loginForm.get('email')?.touched}"
              >
            </div>
            <div *ngIf="loginForm.get('lastname')?.invalid && loginForm.get('lastname')?.touched" class="mt-1 text-sm text-red-600">
              <div *ngIf="loginForm.get('lastname')?.errors?.['required']">Le nom est requis.</div>
            </div>
          </div>
          <!-- Champ Email -->
          <div class="mb-6 group">
            <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Adresse Email</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400 group-focus-within:text-indigo-500 transition-colors duration-200" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207" />
                </svg>
              </div>
              <input
                id="email"
                type="email"
                formControlName="email"
                placeholder="votre@email.com"
                class="block w-full pl-10 pr-3 py-3 border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all duration-200"
                [ngClass]="{'border-red-500 ring-1 ring-red-500': loginForm.get('email')?.invalid && loginForm.get('email')?.touched}"
              >
            </div>
            <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="mt-1 text-sm text-red-600">
              <div *ngIf="loginForm.get('email')?.errors?.['required']">L'email est requis.</div>
              <div *ngIf="loginForm.get('email')?.errors?.['email']">Veuillez entrer une adresse email valide.</div>
            </div>
          </div>

          <!-- Champ Mot de passe -->
          <div class="mb-6 group">
            <div class="flex justify-between items-center mb-1">
              <label for="password" class="block text-sm font-medium text-gray-700">Mot de passe</label>
            </div>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400 group-focus-within:text-indigo-500 transition-colors duration-200" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
              </div>
              <input
                id="password"
                [type]="isPasswordVisible ? 'text' : 'password'"
                formControlName="password"
                placeholder="••••••••••••"
                class="block w-full pl-10 pr-10 py-3 border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all duration-200"
                [ngClass]="{'border-red-500 ring-1 ring-red-500': loginForm.get('password')?.invalid && loginForm.get('password')?.touched}"
              >
              <button
                type="button"
                (click)="togglePasswordVisibility()"
                class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-500 hover:text-gray-700 focus:outline-none"
              >
                <svg *ngIf="!isPasswordVisible" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                </svg>
                <svg *ngIf="isPasswordVisible" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                </svg>
              </button>
            </div>
            <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="mt-1 text-sm text-red-600">
              <div *ngIf="loginForm.get('password')?.errors?.['required']">Le mot de passe est requis.</div>
              <div *ngIf="loginForm.get('password')?.errors?.['minlength']">Le mot de passe doit contenir au moins 6 caractères.</div>
            </div>
          </div>
         <!-- Champ de confirmation de Mot de passe -->
          <div class="mb-6 group">
            <div class="flex justify-between items-center mb-1">
              <label for="confirmed_password" class="block text-sm font-medium text-gray-700">Confirmation mot de passe</label>
            </div>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400 group-focus-within:text-indigo-500 transition-colors duration-200" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
              </div>
              <input
                id="confirmed_password"
                type="password"
                formControlName="confirmed_password"
                placeholder="••••••••••••"
                class="block w-full pl-10 pr-10 py-3 border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all duration-200"
                [ngClass]="{'border-red-500 ring-1 ring-red-500': loginForm.get('confirmed_password')?.invalid && loginForm.get('confirmed_password')?.touched}"
              >

            </div>
            <div *ngIf="loginForm.get('confirmed_password')?.invalid && loginForm.get('confirmed_password')?.touched" class="mt-1 text-sm text-red-600">
              <div *ngIf="loginForm.get('confirmed_password')?.errors?.['required']">confirmer le mot de passe .</div>
            </div>
          </div>



          <!-- Bouton Connexion -->
          <button
            type="submit"
            class="w-full bg-indigo-600 hover:bg-indigo-700 focus:ring-4 focus:ring-indigo-300 text-white font-medium py-3 px-4 rounded-lg shadow-lg hover:shadow-xl transition-all duration-200 flex justify-center items-center"
            [disabled]="isLoading"
          >
            <svg *ngIf="isLoading" class="animate-spin -ml-1 mr-2 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span>{{ isLoading ? 'inscription en cours...' : 'S\'inscription' }}</span>
          </button>
        </form>
        <!-- Options de connexion alternatives -->
      </div>
    </div>
  </div>
</div>
