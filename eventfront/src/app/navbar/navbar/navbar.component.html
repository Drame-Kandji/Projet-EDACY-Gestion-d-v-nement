<!-- navbar.component.html -->
<nav class="bg-white shadow sticky top-0 z-1">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between h-16">
      <div class="flex">
        <!-- Logo -->
        <a routerLink="/" class="flex-shrink-0 flex items-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
          </svg>
          <span class="ml-2 text-xl font-bold text-gray-800">EventManager</span>
        </a>

        <!-- Navigation principale - Desktop -->
        <div class="hidden sm:ml-6 sm:flex sm:space-x-8">
          <a routerLink="/" class="border-indigo-500 text-gray-900 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">
            Accueil
          </a>
          <a routerLink="/events" class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">
            Événements
          </a>
          <a routerLink="/calendrier" class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">
            Calendrier
          </a>
          <a href="#" class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">
            Contacts
          </a>
        </div>
      </div>

      <!-- Actions de navigation à droite -->
      <div class="hidden sm:ml-6 sm:flex sm:items-center">
        <!-- Bouton de notification -->
        <button class="bg-white p-1 rounded-full text-gray-400 hover:text-gray-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
          <span class="sr-only">Voir les notifications</span>
          <svg class="h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
          </svg>
        </button>

        <!-- Bouton de création d'événement -->
        <button (click)="create_event()" class="ml-3 bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-md text-sm font-medium">
          Créer un événement
        </button>

        <!-- Menu profil utilisateur -->
        <div class="ml-3 relative">
          <div *ngIf="isLoggedIn; else loginButton">
            <button (click)="toggleMenu()" type="button" class="bg-white rounded-full flex text-sm focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500" aria-expanded="false">
              <span class="sr-only">Ouvrir menu utilisateur</span>
              <img class="h-8 w-8 rounded-full" [src]="currentUser.avatar" alt="">
            </button>

            <!-- Menu déroulant -->
            <div *ngIf="isMenuOpen" class="origin-top-right absolute right-0 mt-2 w-48 rounded-md shadow-lg py-1 bg-white ring-1 ring-black ring-opacity-5 focus:outline-none" role="menu" aria-orientation="vertical" aria-labelledby="user-menu-button" tabindex="-1">
              <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100" role="menuitem">Votre profil</a>
              <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100" role="menuitem">Paramètres</a>
              <a routerLink="/connexion" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100" role="menuitem" (click)="logout()">Déconnexion</a>
            </div>
          </div>

          <!-- Afficher les boutons de connexion/inscription si non connecté -->
          <ng-template #loginButton>
            <div class="flex space-x-2">
              <a routerLink="/connexion"  class="text-gray-500 hover:text-gray-700 px-3 py-2 rounded-md text-sm font-medium">Connexion</a>
              <a routerLink="/inscription" routerLinkActive="router-link-active"  class="bg-indigo-600 text-white hover:bg-indigo-700 px-3 py-2 rounded-md text-sm font-medium">Inscription</a>
            </div>
          </ng-template>
        </div>
      </div>

      <!-- Bouton menu mobile -->
      <div class="-mr-2 flex items-center sm:hidden">
        <button (click)="create_event()" class="ml-3 bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-md text-sm font-medium">
          Créer un événement
        </button>
        <button (click)="toggleMenu()" type="button" class="inline-flex items-center justify-center ms-3 p-2 rounded-md text-gray-400 hover:text-gray-500 hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-indigo-500" aria-controls="mobile-menu" aria-expanded="false">
          <span class="sr-only">Ouvrir le menu principal</span>
          <!-- Icône menu (quand fermé) -->
          <svg *ngIf="!isMenuOpen" class="block h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
          <!-- Icône X (quand ouvert) -->
          <svg *ngIf="isMenuOpen" class="block h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Menu mobile -->
  <div *ngIf="isMenuOpen" class="sm:hidden" id="mobile-menu">
    <div class="pt-2 pb-3 space-y-1">
      <a routerLink="/" (click)="toggleMenu()" class="bg-indigo-50 border-indigo-500 text-indigo-700 block pl-3 pr-4 py-2 border-l-4 text-base font-medium">
        Accueil
      </a>
      <a routerLink="/events" (click)="toggleMenu()" class="border-transparent text-gray-500 hover:bg-gray-50 hover:border-gray-300 hover:text-gray-700 block pl-3 pr-4 py-2 border-l-4 text-base font-medium">
        Événements
      </a>
      <a routerLink="/calendrier" (click)="toggleMenu()" class="border-transparent text-gray-500 hover:bg-gray-50 hover:border-gray-300 hover:text-gray-700 block pl-3 pr-4 py-2 border-l-4 text-base font-medium">
        Calendrier
      </a>
      <a href="#" (click)="toggleMenu()" class="border-transparent text-gray-500 hover:bg-gray-50 hover:border-gray-300 hover:text-gray-700 block pl-3 pr-4 py-2 border-l-4 text-base font-medium">
        Contacts
      </a>
    </div>

    <!-- Section utilisateur mobile -->
    <div *ngIf="isLoggedIn" class="pt-4 pb-3 border-t border-gray-200">
      <div class="flex items-center px-4">
        <div class="flex-shrink-0">
          <img class="h-10 w-10 rounded-full" [src]="currentUser.avatar" alt="">
        </div>
        <div class="ml-3">
          <div class="text-base font-medium text-gray-800">{{ currentUser.name }}</div>
        </div>
        <button class="ml-auto flex-shrink-0 bg-white p-1 rounded-full text-gray-400 hover:text-gray-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
          <span class="sr-only">Voir les notifications</span>
          <svg class="h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
          </svg>
        </button>
      </div>
      <div class="mt-3 space-y-1 z-1">
        <a href="#" class="block px-4 py-2 text-base font-medium text-gray-500 hover:text-gray-800 hover:bg-gray-100">
          Votre profil
        </a>
        <a href="#" class="block px-4 py-2 text-base font-medium text-gray-500 hover:text-gray-800 hover:bg-gray-100">
          Paramètres
        </a>
        <a  (click)="logout()" routerLink="/connexion"  class="block px-4 py-2 text-base font-medium text-gray-500 hover:text-gray-800 hover:bg-gray-100" (click)="logout()">
          Déconnexion
        </a>
      </div>
    </div>

    <!-- Boutons connexion/inscription mobile -->
    <div *ngIf="!isLoggedIn" class="pt-4 pb-3 border-t border-gray-200">
      <div class="space-y-1 px-4">
        <a [routerLink]="['/connexion']" routerLinkActive="router-link-active" (click)="toggleMenu()" class="block text-center py-2 rounded-md text-base font-medium text-gray-500 hover:text-gray-800 hover:bg-gray-100">
          Connexion
        </a>
        <a routerLink="/inscription" (click)="toggleMenu()" class="block text-center py-2 rounded-md text-base font-medium bg-indigo-600 text-white hover:bg-indigo-700">
          Inscription
        </a>
      </div>
    </div>
  </div>
</nav>
